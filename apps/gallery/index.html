<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0a0907" />
    <title>拾光 · Relight</title>
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <!-- 悬浮 HUD：极薄顶层（品牌字 + 当前单元所属日期，滚动联动） -->
    <div id="hud" class="hud" data-role="hud" aria-hidden="true">
      <span class="hud-brand">拾光</span>
      <span class="hud-date" data-role="hud-date"></span>
    </div>

    <!-- 主流容器：单一垂直沉浸流（scroll-snap 逐屏吸附） -->
    <main id="stream" class="stream" data-role="stream"></main>

    <!-- 载入态（manifest 拉取中） -->
    <div id="loading" class="loading" data-role="loading">
      <p>正在加载画廊…</p>
    </div>

    <!-- 错误态（manifest fetch 失败 → S11.PM1/PM2） -->
    <div
      id="error-fallback"
      class="error-fallback"
      data-role="error-fallback"
      hidden
    >
      <p class="error-title">画廊暂不可用</p>
      <p class="error-msg" data-role="error-msg"></p>
      <button class="btn-retry" type="button" data-role="retry-button">重试</button>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
